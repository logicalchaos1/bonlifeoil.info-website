    <script>
      // Older iOS Safari (< 15.4) lacks these; the animation library calls Object.hasOwn on load.
      if (!Object.hasOwn) Object.hasOwn = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
      if (![].at) Object.defineProperty(Array.prototype, "at", { value: function (i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this[i]; }, configurable: true, writable: true });
    </script>
    <style>
      /* Pages are built as finished HTML. Fade-in animations start hidden (opacity:0 in the
         built markup); keep that content visible until the script takes over each element. */
      #root[data-ssr] [style*="opacity:0"] { opacity: 1 !important; transform: none !important; }
    </style>
  </head>

  <body>
    <div id="root"></div><!-- /root -->
    <script>
      // Pages not built ahead of time start empty and are drawn by the script. If that never
      // happens (failed download), reload once with a fresh copy; sessionStorage stops a loop.
      window.addEventListener("load", function () {
        setTimeout(function () {
          var r = document.getElementById("root");
          if (!r || r.dataset.ssr || r.hasChildNodes()) return;
          try {
            if (sessionStorage.getItem("bonlife-boot-retry")) return;
            sessionStorage.setItem("bonlife-boot-retry", "1");
          } catch (e) { return; }
          var u = new URL(window.location.href);
          u.searchParams.set("r", Date.now().toString(36));
          window.location.replace(u.toString());
        }, 4000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
