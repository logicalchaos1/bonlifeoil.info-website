<script type="module">
// Studio renders of the /suministros products. Original geometry and labels only.
// Opened by render-mockups.mjs as mockups.html#<key>; sets window.done when the frame is ready.
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const SIZE = 1000;
const GREEN = "#0a1a0f", GOLD = "#c9a227";

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#f4efe3");
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(4.2, 3.2, 6.4);
camera.lookAt(0, 0.9, 0);

const key = new THREE.DirectionalLight("#ffffff", 2.2);
key.position.set(4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -5;
key.shadow.camera.right = key.shadow.camera.top = 5;
key.shadow.radius = 6;
key.shadow.bias = -0.0005;
scene.add(key);
scene.add(new THREE.HemisphereLight("#ffffff", "#e9dfc6", 0.6));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- helpers ----------
const shadowed = (m) => { m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; };
const mat = (o) => new THREE.MeshPhysicalMaterial(o);

// Printed label drawn on a canvas. lines: [{text, size, color, weight}]
// fit: share of the label width text may use (curved labels only show their middle).
function labelTexture({ w = 1024, h = 1024, bg = "#ffffff", band = GREEN, lines = [], brand = true, footer = "", fit = 0.86 }) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  if (band) { g.fillStyle = band; g.fillRect(0, 0, w, h * 0.22); }
  if (brand) {
    g.font = `italic 800 ${h * 0.12}px Helvetica, Arial, sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle";
    const y = h * 0.11;
    const bon = g.measureText("Bon").width, life = g.measureText("life").width;
    const x0 = w / 2 - (bon + life) / 2;
    g.textAlign = "left";
    g.fillStyle = band ? "#ffffff" : GREEN; g.fillText("Bon", x0, y);
    g.fillStyle = GOLD; g.fillText("life", x0 + bon, y);
  }
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  let y = h * 0.36;
  for (const l of lines) {
    let px = l.size * h;
    g.font = `${l.weight ?? 800} ${px}px Helvetica, Arial, sans-serif`;
    while (g.measureText(l.text).width > w * fit && px > 10) {
      px *= 0.94;
      g.font = `${l.weight ?? 800} ${px}px Helvetica, Arial, sans-serif`;
    }
    g.fillStyle = l.color ?? GREEN;
    y += px * (l.gap ?? 1.15);
    g.fillText(l.text, w / 2, y);
  }
  if (footer) {
    g.fillStyle = GOLD; g.fillRect(0, h * 0.86, w, h * 0.14);
    g.font = `700 ${h * 0.06}px Helvetica, Arial, sans-serif`; g.fillStyle = GREEN;
    g.fillText(footer, w / 2, h * 0.95);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

// Subtle paper grain for rolls and wrappers.
function grain(base = 245, amount = 10) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"); const img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = base - Math.random() * amount;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4);
  return t;
}

const lathe = (pts, seg = 96) => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg);

// ---------- products ----------
// Round gallon jug like the HDPE gallons sold in RD: rounded body, handle molded
// into the shoulder, wrap-around label. shell: "opaque" (white HDPE) or "clear"
// (translucent plastic showing the liquid color).
function jug({ liquid, shell = "clear", tint = "#ffffff", accent = GREEN, title, sub }) {
  const g = new THREE.Group();
  const R = 0.78, H = 2.0;
  const profile = [[0, 0], [R - 0.12, 0], [R - 0.02, 0.05], [R, 0.18], [R, H * 0.72], [R - 0.06, H * 0.84],
    [R - 0.3, H * 0.95], [0.3, H * 1.0], [0.24, H * 1.03], [0.24, H * 1.1]];
  const shellMat = shell === "opaque"
    ? mat({ color: "#f7f7f5", roughness: 0.38, clearcoat: 0.3, clearcoatRoughness: 0.4 })
    : mat({ color: tint, roughness: 0.18, transmission: 0.85, thickness: 0.08, ior: 1.45, transparent: true, opacity: 0.6 });
  const body = new THREE.Mesh(lathe(profile, 96), shellMat); g.add(body);
  if (shell !== "opaque") { // liquid inside, filled to the shoulder
    const fill = profile.filter(([, y]) => y <= H * 0.8).map(([x, y]) => [Math.max(0, x - 0.04), y + 0.02]);
    fill.push([0, H * 0.8]);
    g.add(new THREE.Mesh(lathe(fill, 96), mat({ color: liquid, roughness: 0.1, transmission: 0.35, thickness: 1.2, transparent: true, opacity: 0.92 })));
  }
  // handle: a loop molded into the shoulder on the back-right
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.1, 24, 64, Math.PI * 1.15), shellMat);
  handle.position.set(0.5, H * 0.82, -0.25); handle.rotation.set(0, -Math.PI / 4, Math.PI * 0.32); g.add(handle);
  // ribbed cap
  const capMat = mat({ color: shell === "opaque" ? accent : "#f4f4f4", roughness: 0.42 });
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.24, 48), capMat); cap.position.y = H * 1.1 + 0.1; g.add(cap);
  for (let i = 0; i < 40; i++) {
    const r = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.22, 0.03), capMat), a = (i / 40) * Math.PI * 2;
    r.position.set(Math.cos(a) * 0.29, cap.position.y, Math.sin(a) * 0.29); r.rotation.y = -a; g.add(r);
  }
  // wrap-around label facing the camera
  const tex = labelTexture({ w: 1400, h: 900, band: accent, footer: "1 GALÓN · 3.78 L", fit: 0.5,
    lines: [{ text: title, size: 0.13 }, { text: sub, size: 0.075, weight: 500, color: "#444", gap: 1.6 }] });
  // Cylinder theta 0 points at +z; the camera sits about 0.18π toward +x, so center the label there.
  const label = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.006, R + 0.006, 0.95, 96, 1, true, Math.PI * (0.18 - 0.55), Math.PI * 1.1),
    mat({ map: tex, roughness: 0.45, side: THREE.DoubleSide }));
  label.position.y = 0.75; g.add(label);
  return g;
}

function paperRoll(R, r, h, color = "#fbfbf8") {
  const g = new THREE.Group();
  const paper = mat({ color, roughness: 0.92, map: grain(250, 14) });
  const tube = new THREE.Mesh(lathe([[r, 0], [R - 0.02, 0], [R, 0.02], [R, h - 0.02], [R - 0.02, h], [r, h], [r, 0]]), paper);
  g.add(tube);
  const core = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 48, 1, true), mat({ color: "#b98f5e", roughness: 0.85, side: THREE.DoubleSide }));
  core.position.y = h / 2; g.add(core);
  // spiral lines on the faces
  const ringMat = new THREE.MeshBasicMaterial({ color: "#e4e1d8" });
  for (let k = 1; k < 7; k++) {
    const rr = r + ((R - r) * k) / 7;
    const ring = new THREE.Mesh(new THREE.RingGeometry(rr, rr + 0.004, 96), ringMat);
    ring.rotation.x = -Math.PI / 2; ring.position.y = h + 0.001; g.add(ring);
  }
  return g;
}

// Face order: +x, -x, +y (top), -y, +z (front), -z. labelFace picks where the print goes.
function wrapperPack(w, h, d, tex, color = "#ffffff", labelFace = 4) {
  const faces = Array.from({ length: 6 }, (_, i) => (i === labelFace ? mat({ map: tex, roughness: 0.55 }) : mat({ color, roughness: 0.6 })));
  return new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 6, 0.08), faces);
}

function printedBox(w, h, d, tex, color = "#ffffff") {
  const side = mat({ color, roughness: 0.7 });
  return new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, 0.03), [side, side, side, side, mat({ map: tex, roughness: 0.6 }), side]);
}

function cup(x, z, scale = 1, color = "#fbfbf9") {
  const m = new THREE.Mesh(lathe([[0, 0], [0.33, 0], [0.34, 0.02], [0.46, 1.1], [0.49, 1.12], [0.48, 1.16], [0.44, 1.12], [0.31, 0.06], [0, 0.06]]),
    mat({ color, roughness: 0.95, side: THREE.DoubleSide }));
  m.position.set(x, 0, z); m.scale.setScalar(scale); return m;
}

const S = {
  "galon-desengrasante": () => jug({ shell: "opaque", accent: "#d9741f", title: "DESENGRASANTE", sub: "Cocinas, campanas y freidoras" }),
  "galon-lavaplatos": () => jug({ liquid: "#2f9a3a", tint: "#e9f6ea", accent: GREEN, title: "LAVAPLATOS", sub: "Aroma limón" }),
  "galon-jabon": () => jug({ shell: "opaque", accent: "#d9578c", title: "JABÓN DE MANOS", sub: "Para dispensadores" }),
  "galon-desinfectante": () => jug({ liquid: "#6b3fb8", tint: "#f1ecfa", accent: "#5a3299", title: "DESINFECTANTE", sub: "Lavanda · pisos y superficies" }),
  "galon-cloro": () => jug({ liquid: "#cfe0ee", tint: "#dfeaf3", accent: "#2f6fb0", title: "CLORO", sub: "Blanqueador desinfectante" }),
  "galon-detergente": () => jug({ liquid: "#e9eef2", tint: "#f4f7fa", accent: "#3c8bd0", title: "DETERGENTE", sub: "Neutro multiuso" }),
  "galon-cristales": () => jug({ liquid: "#2d7fd4", tint: "#e3effa", accent: "#1f62aa", title: "LIMPIACRISTALES", sub: "Vidrios y espejos" }),

  "papel-higienico": () => {
    const g = new THREE.Group();
    const R = 0.46, h = 0.42;
    for (let layer = 0; layer < 2; layer++)
      for (let i = 0; i < 3; i++)
        for (let j = 0; j < 2; j++) {
          const r = paperRoll(R, 0.12, h); r.position.set((i - 1) * R * 2.02, layer * (h + 0.02), (j - 0.5) * R * 2.02); g.add(r);
        }
    const film = new THREE.Mesh(new RoundedBoxGeometry(R * 6.2, h * 2 + 0.1, R * 4.2, 6, 0.12),
      mat({ color: "#ffffff", roughness: 0.15, transmission: 0.95, thickness: 0.01, transparent: true, opacity: 0.28 }));
    film.position.y = h + 0.01; g.add(film);
    const tex = labelTexture({ w: 1600, h: 600, lines: [{ text: "PAPEL HIGIÉNICO JUMBO", size: 0.12 }, { text: "12 rollos · 350 pies", size: 0.09, weight: 500, color: "#444" }] });
    const band = new THREE.Mesh(new THREE.PlaneGeometry(R * 4.4, 0.62), mat({ map: tex, roughness: 0.5, transparent: true }));
    band.position.set(0, h * 0.95, R * 2.1 + 0.02); g.add(band);
    return g;
  },
  "papel-toalla": () => {
    const g = new THREE.Group();
    [[-0.85, "#fbfbf8"], [0, "#c79a68"], [0.85, "#fbfbf8"]].forEach(([x, c], i) => {
      const r = paperRoll(0.42, 0.13, 2.1, c); r.position.set(x, 0, i === 1 ? -0.5 : 0.15); g.add(r);
    });
    return g;
  },
  servilletas: () => {
    const g = new THREE.Group();
    const tex = labelTexture({ w: 1600, h: 560, lines: [{ text: "SERVILLETAS", size: 0.17 }, { text: "500 unidades · una hoja", size: 0.09, weight: 500, color: "#444" }] });
    const pack = wrapperPack(2.8, 0.75, 1.15, tex, "#ffffff"); pack.position.y = 0.375; g.add(pack);
    for (let i = 0; i < 5; i++) {
      const s = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.012, 1.0), mat({ color: "#ffffff", roughness: 0.95 }));
      s.position.set(2.0, 0.01 + i * 0.014, 0.75); s.rotation.y = 0.35 + i * 0.04; g.add(s);
    }
    return g;
  },
  "fundas-basura": () => {
    const g = new THREE.Group();
    const black = mat({ color: "#141414", roughness: 0.3, clearcoat: 0.7, clearcoatRoughness: 0.35 });
    for (let i = 0; i < 7; i++) {
      const geo = new RoundedBoxGeometry(2.6, 0.075, 1.5, 3, 0.03);
      const p = geo.attributes.position;
      for (let k = 0; k < p.count; k++) p.setY(k, p.getY(k) + 0.02 * Math.sin(p.getX(k) * 3 + i) * Math.cos(p.getZ(k) * 4));
      geo.computeVertexNormals();
      const f = new THREE.Mesh(geo, black); f.position.set((i % 2) * 0.03, 0.04 + i * 0.08, (i % 3) * 0.02); g.add(f);
    }
    const tex = labelTexture({ w: 1400, h: 700, lines: [{ text: "FUNDAS NEGRAS", size: 0.14 }, { text: "55 galones · 100/1", size: 0.1, weight: 500, color: "#444" }] });
    const band = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.62, 1.56), [mat({ color: "#fff" }), mat({ color: "#fff" }), mat({ color: "#fff", roughness: 0.6 }), mat({ color: "#fff" }), mat({ map: tex, roughness: 0.55 }), mat({ color: "#fff" })]);
    band.position.y = 0.31; g.add(band);
    return g;
  },
  guantes: () => {
    const g = new THREE.Group();
    const tex = labelTexture({ w: 1600, h: 600, lines: [{ text: "GUANTES DE VINIL", size: 0.14 }, { text: "500 unidades · talla única · desechables", size: 0.075, weight: 500, color: "#444" }] });
    const box = printedBox(2.9, 0.75, 1.3, tex); box.position.y = 0.375; g.add(box);
    const slot = new THREE.Mesh(new THREE.CircleGeometry(0.42, 48), mat({ color: "#d9d9d9", roughness: 0.9 }));
    slot.scale.set(2.2, 0.55, 1); slot.rotation.x = -Math.PI / 2; slot.position.set(0, 0.752, 0); g.add(slot);
    const glove = new THREE.Mesh(new THREE.SphereGeometry(0.35, 48, 32), mat({ color: "#eef3f7", roughness: 0.25, transmission: 0.6, thickness: 0.1, transparent: true, opacity: 0.85 }));
    glove.scale.set(1.4, 0.35, 0.5); glove.position.set(0.1, 0.83, 0); g.add(glove);
    return g;
  },
  vasos: () => {
    const g = new THREE.Group();
    for (let i = 0; i < 18; i++) { const c = cup(-0.5, 0, 1); c.position.y = i * 0.11; g.add(c); }
    const film = new THREE.Mesh(lathe([[0.36, 0], [0.53, 0], [0.53, 3.15], [0.36, 3.2]]), mat({ color: "#ffffff", roughness: 0.12, transmission: 0.95, transparent: true, opacity: 0.25, side: THREE.DoubleSide }));
    film.position.x = -0.5; g.add(film);
    const tex = labelTexture({ w: 1400, h: 900, lines: [{ text: "VASOS FOAM", size: 0.15 }, { text: "12 oz · 25 unidades", size: 0.09, weight: 500, color: "#444" }] });
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.545, 0.545, 0.9, 64, 1, true, -Math.PI * 0.45, Math.PI * 0.9), mat({ map: tex, roughness: 0.5, side: THREE.DoubleSide }));
    band.position.set(-0.5, 1.4, 0); band.rotation.y = Math.PI * 0.18; g.add(band);
    const loose = cup(0.65, 0.45, 1); g.add(loose);
    return g;
  },
  "bandeja-foam": () => {
    const g = new THREE.Group();
    const foam = mat({ color: "#fdfdfb", roughness: 1, map: grain(252, 8) });
    const base = new THREE.Mesh(new RoundedBoxGeometry(2.2, 0.55, 1.9, 6, 0.12), foam); base.position.y = 0.28; g.add(base);
    const lid = new THREE.Mesh(new RoundedBoxGeometry(2.2, 0.5, 1.9, 6, 0.14), foam);
    lid.geometry.translate(0, 0.25, 0.95); lid.position.set(0, 0.55, -0.95); lid.rotation.x = -1.0; g.add(lid);
    const b2 = new THREE.Mesh(new RoundedBoxGeometry(2.2, 1.05, 1.9, 6, 0.14), foam); b2.position.set(2.0, 0.52, 1.0); b2.rotation.y = -0.5; g.add(b2);
    return g;
  },
  "envase-deli": () => {
    const g = new THREE.Group();
    const clear = mat({ color: "#ffffff", roughness: 0.04, transmission: 1, thickness: 0.02, ior: 1.4, transparent: true, opacity: 0.55 });
    const make = (x, z, fill) => {
      const c = new THREE.Mesh(lathe([[0, 0], [0.62, 0], [0.75, 0.95], [0.78, 0.97], [0, 0.97]]), clear); c.position.set(x, 0, z); g.add(c);
      const f = new THREE.Mesh(lathe([[0, 0.02], [0.6, 0.02], [0.7, 0.6], [0, 0.6]]), mat({ color: fill, roughness: 0.7 })); f.position.set(x, 0, z); g.add(f);
      const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.82, 0.08, 64), clear); lid.position.set(x, 1.0, z); g.add(lid);
    };
    make(-0.6, 0, "#e7b24a"); make(0.85, 0.5, "#8fbf4d");
    return g;
  },
  "envase-aluminio": () => {
    const g = new THREE.Group();
    const foil = mat({ color: "#d8dce0", metalness: 1, roughness: 0.3 });
    const tray = new THREE.Mesh(new RoundedBoxGeometry(2.4, 0.7, 1.7, 6, 0.08), foil);
    tray.geometry.attributes.position.array.forEach((_, i, a) => { if (i % 3 === 0 && a[i + 1] < 0) { a[i] *= 0.86; a[i + 2] *= 0.84; } });
    tray.geometry.computeVertexNormals(); tray.position.y = 0.35; g.add(tray);
    for (let i = 0; i < 22; i++) { // pressed ridges on the long sides
      const x = -1.0 + (i * 2.0) / 21;
      for (const z of [0.79, -0.79]) {
        const rib = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.55, 0.02), foil);
        rib.position.set(x * 0.95, 0.36, z * 0.95); rib.rotation.x = z > 0 ? 0.18 : -0.18; g.add(rib);
      }
    }
    const rim = new THREE.Mesh(new RoundedBoxGeometry(2.55, 0.06, 1.85, 4, 0.03), foil); rim.position.y = 0.72; g.add(rim);
    const lid = new THREE.Mesh(new RoundedBoxGeometry(2.5, 0.32, 1.8, 6, 0.14), mat({ color: "#ffffff", roughness: 0.05, transmission: 0.95, thickness: 0.02, transparent: true, opacity: 0.35 }));
    lid.position.y = 0.88; g.add(lid);
    const tex = labelTexture({ w: 1200, h: 600, lines: [{ text: "ENVASE DE ALUMINIO", size: 0.11 }, { text: "1.5 lb · con tapa · 125 uds", size: 0.08, weight: 500, color: "#444" }] });
    const sticker = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.6), mat({ map: tex, roughness: 0.5 }));
    sticker.rotation.x = -Math.PI / 2; sticker.position.set(0, 1.045, 0.15); g.add(sticker);
    return g;
  },
  cubiertos: () => {
    const g = new THREE.Group();
    [["TENEDORES", -0.75, 0.15], ["CUCHARAS", 0.75, -0.25]].forEach(([t, x, r]) => {
      const tex = labelTexture({ w: 1024, h: 768, lines: [{ text: t, size: 0.13 }, { text: "Plásticos · 500 unidades", size: 0.075, weight: 500, color: "#444" }] });
      const box = printedBox(1.4, 1.1, 0.9, tex); box.position.set(x, 0.55, x > 0 ? -0.2 : 0.3); box.rotation.y = r; g.add(box);
    });
    // fork outline: handle plus a head with four tines
    const sh = new THREE.Shape();
    sh.moveTo(-0.05, 0); sh.lineTo(0.05, 0); sh.lineTo(0.06, 0.95); sh.lineTo(0.16, 1.1); sh.lineTo(0.16, 1.55);
    for (let k = 0; k < 4; k++) { const x0 = 0.16 - k * 0.093; sh.lineTo(x0, 1.55); sh.lineTo(x0 - 0.05, 1.55); sh.lineTo(x0 - 0.05, 1.22); sh.lineTo(x0 - 0.093, 1.22); }
    sh.lineTo(-0.16, 1.55); sh.lineTo(-0.16, 1.1); sh.lineTo(-0.06, 0.95); sh.lineTo(-0.05, 0);
    const forkGeo = new THREE.ExtrudeGeometry(sh, { depth: 0.035, bevelEnabled: true, bevelSize: 0.01, bevelThickness: 0.01, bevelSegments: 2 });
    const white = mat({ color: "#ffffff", roughness: 0.32, clearcoat: 0.5 });
    [[0.2, 1.1, 0.2], [0.5, 1.0, -0.1]].forEach(([x, z, r]) => {
      const f = new THREE.Mesh(forkGeo, white); f.rotation.set(-Math.PI / 2, 0, r + 1.2); f.position.set(x, 0.03, z); g.add(f);
    });
    return g;
  },
  sorbetes: () => {
    const g = new THREE.Group();
    const tex = labelTexture({ w: 1100, h: 1400, lines: [{ text: "SORBETES", size: 0.1 }, { text: "Envueltos", size: 0.065, weight: 500, color: "#444" }, { text: "500 unidades", size: 0.065, weight: 500, color: "#444" }] });
    const bag = wrapperPack(1.5, 2.0, 0.4, tex, "#ffffff"); bag.position.y = 1.0; bag.rotation.y = -0.15; g.add(bag);
    const paper = mat({ color: "#f3efe4", roughness: 0.7 });
    for (let i = 0; i < 5; i++) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1.9, 16), paper);
      s.rotation.set(Math.PI / 2, 0, 0.9 + i * 0.05); s.position.set(1.15 + i * 0.09, 0.035, 0.75 - i * 0.05); g.add(s);
    }
    return g;
  },
  "jabon-tocador": () => {
    const g = new THREE.Group();
    const tex = labelTexture({ w: 1024, h: 600, bg: "#fffdf7", lines: [{ text: "JABÓN DE TOCADOR", size: 0.11 }, { text: "Uso hotelero", size: 0.08, weight: 500, color: "#555" }] });
    [[-0.9, 0, 0.3, 0.2], [0.5, 0, 0.6, -0.3], [-0.2, 0.42, 0.35, 0.05]].forEach(([x, y, z, r]) => {
      const bar = wrapperPack(1.3, 0.4, 0.85, tex, "#fffdf7", 2); bar.rotation.y = r;
      bar.position.set(x, y + 0.2, z); g.add(bar);
    });
    return g;
  },
  amenidades: () => {
    const g = new THREE.Group();
    const items = [["SHAMPOO", "#ffffff"], ["ACONDICIONADOR", "#f2ead6"], ["GEL DE BAÑO", "#e5efe8"]];
    items.forEach(([t, c], i) => {
      const b = new THREE.Mesh(lathe([[0, 0], [0.32, 0], [0.34, 0.04], [0.34, 1.35], [0.28, 1.5], [0.12, 1.58], [0, 1.58]]), mat({ color: c, roughness: 0.3, clearcoat: 0.6 }));
      b.position.set(-1.0 + i * 0.95, 0, i === 1 ? -0.3 : 0.2); g.add(b);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.22, 32), mat({ color: GOLD, metalness: 0.8, roughness: 0.3 }));
      cap.position.set(b.position.x, 1.68, b.position.z); g.add(cap);
      const lab = new THREE.Mesh(new THREE.CylinderGeometry(0.345, 0.345, 0.75, 64, 1, true, -Math.PI / 2.2, Math.PI / 1.1),
        mat({ map: labelTexture({ w: 1024, h: 1024, band: null, bg: c, lines: [{ text: t, size: t.length > 10 ? 0.075 : 0.1 }, { text: "30 ml", size: 0.07, weight: 500, color: "#555" }] }), roughness: 0.4 }));
      lab.position.set(b.position.x, 0.62, b.position.z); g.add(lab);
    });
    const tex = labelTexture({ w: 1024, h: 600, lines: [{ text: "KIT DENTAL", size: 0.13 }] });
    const box = printedBox(0.9, 0.3, 0.55, tex); box.rotation.x = -Math.PI / 2; box.position.set(1.4, 0.15, 0.9); box.rotation.z = 0.4; g.add(box);
    return g;
  },
};

const name = decodeURIComponent(location.hash.slice(1));
const product = shadowed(S[name]());
// Frame: center the product and fit the camera to its size.
const bbox = new THREE.Box3().setFromObject(product);
const center = bbox.getCenter(new THREE.Vector3()), size = bbox.getSize(new THREE.Vector3());
product.position.x -= center.x; product.position.z -= center.z;
scene.add(product);
const radius = size.length() / 2;
const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.12;
const dir = new THREE.Vector3(0.55, 0.42, 0.85).normalize();
const target = new THREE.Vector3(0, size.y / 2, 0);
camera.position.copy(target).addScaledVector(dir, dist);
camera.lookAt(target);
// Tighten or loosen so the product's on-screen extent fills ~80% of the frame.
const box = new THREE.Box3().setFromObject(product);
for (let i = 0; i < 4; i++) {
  camera.updateMatrixWorld();
  let ext = 0;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const v = new THREE.Vector3(x, y, z).project(camera);
    ext = Math.max(ext, Math.abs(v.x), Math.abs(v.y));
  }
  const d = camera.position.distanceTo(target) * (ext / 0.8);
  camera.position.copy(target).addScaledVector(dir, d);
  camera.lookAt(target);
}
renderer.render(scene, camera);

// Brand mark and "illustrative" note composited over the render.
const out = document.createElement("canvas"); out.width = out.height = SIZE;
const g = out.getContext("2d");
g.drawImage(renderer.domElement, 0, 0);
g.font = "italic 800 44px Helvetica, Arial, sans-serif";
g.fillStyle = GREEN; g.fillText("Bon", 40, 70);
g.fillStyle = GOLD; g.fillText("life", 40 + g.measureText("Bon").width, 70);
g.font = "400 18px Helvetica, Arial, sans-serif"; g.fillStyle = "rgba(10,26,15,.45)";
g.textAlign = "right"; g.fillText("Imagen ilustrativa", SIZE - 28, SIZE - 24);
window.output = out.toDataURL("image/jpeg", 0.86);
window.done = true;
</script>
